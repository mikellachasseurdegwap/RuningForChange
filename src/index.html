<section class="section">
  <h2 class="section-title">Rester informé</h2>
  <p class="section-desc">Un petit formulaire (newsletter) pour la contrainte “section complexe”.</p>

  <form class="form" id="newsletter-form">
    <div class="form-row">
      <label for="email">Email</label>
      <input id="email" name="email" type="email" placeholder="ex: mikel@gmail.com" required />
    </div>

    <div class="form-row">
      <label for="message">Message (optionnel)</label>
      <textarea id="message" name="message" rows="4" placeholder="Un mot, une idée…"></textarea>
    </div>

    <div class="form-actions">
      <button class="btn" type="submit">S’inscrire</button>
      <p class="form-hint" id="form-hint" aria-live="polite"></p>
    </div>
  </form>
</section>
